[package]
name = "beadboard"
version = "0.3.2"
description = "Pixel-art template designer for beads and LEGO"
authors = ["Daniel"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue 8519 on Windows).
name = "beadboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde_json = "1" # used by the generated config for plugin settings

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
